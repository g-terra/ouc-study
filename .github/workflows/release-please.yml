name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # a release goes out only if the app still works on the code being released
  smoke:
    uses: ./.github/workflows/smoke.yml

  release-please:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # GitHub runs no checks on a PR that GITHUB_TOKEN pushes (the release PR would wait forever on
          # the required checks), so release-please uses a token of the maintainer's: see CONTRIBUTING.md
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
