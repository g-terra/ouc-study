name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # a release goes out only if the app still works on the code being released
  smoke:
    uses: ./.github/workflows/smoke.yml

  release-please:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # GitHub runs no checks on a PR that GITHUB_TOKEN pushes (the release PR would wait forever on
          # the required checks), so release-please uses a token of the maintainer's: see CONTRIBUTING.md
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # every release goes out on its own: the release PR merges itself (squash) once its required
      # checks pass. If main moved on without a release-worthy commit, release-please leaves the PR
      # as it is, so bring it up to date here (the ruleset wants PRs up to date with main).
      - name: Merge the release PR when its checks pass
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "No RELEASE_PLEASE_TOKEN: merge the release PR by hand"; exit 0; }
          # the REST list, not gh pr list --label: search lags behind a PR that was opened a second ago
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '[.[] | select(any(.labels[]; .name == "autorelease: pending"))][0].number // empty')
          [ -n "$pr" ] || { echo "No release PR open"; exit 0; }
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" --jq .behind_by)
          if [ "$behind" != "0" ]; then gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/update-branch" > /dev/null; fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
