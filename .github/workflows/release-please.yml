name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # a release goes out only if the app still works on the code being released
  smoke:
    uses: ./.github/workflows/smoke.yml

  release-please:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GitHub doesn't start workflows for pushes made with GITHUB_TOKEN, so release-please's PR would
      # wait forever on the required checks. Start them on its new head (workflow_dispatch is allowed).
      - name: Run the required checks on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --label "autorelease: pending" --state open --json headRefName,headRefOid --jq '.[0] // empty')
          [ -n "$pr" ] || { echo "No release PR open"; exit 0; }
          branch=$(echo "$pr" | jq -r .headRefName); sha=$(echo "$pr" | jq -r .headRefOid)
          ran=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=Conventional%20Commits%20title" --jq .total_count)
          [ "$ran" = "0" ] || { echo "Checks already ran on $sha"; exit 0; }
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
