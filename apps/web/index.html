<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><style>.t%7Bfill:%231c1b19%7D.o%7Bstroke:%23f6f4ef%7D.r%7Bfill:%23c2410c%7D.l%7Bstroke:%23c2410c%7D%40media (prefers-color-scheme:dark)%7B.t%7Bfill:%23ecebe6%7D.o%7Bstroke:%23131312%7D.r%7Bfill:%23fb923c%7D.l%7Bstroke:%23fb923c%7D%7D</style><rect class='t' width='32' height='32' rx='8'/><circle class='o' cx='16' cy='19.5' r='6.3' fill='none' stroke-width='3.2'/><path class='r' d='M16 4.5 28 9.5 16 14.5 4 9.5z'/><path class='l' d='M25 10.8v5.4' stroke-width='1.4' stroke-linecap='round'/></svg>" />
    <title>OUC Study</title>
    <script>
      // apply the saved colour theme before the first paint (lib/theme.ts keeps it in sync afterwards)
      try {
        var t = localStorage.getItem("ouc-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.mode = /^(dark|midnight|forest)$/.test(t) ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
