<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><style>.t%7Bfill:%231c1b19%7D.o%7Bstroke:%23f6f4ef%7D.r%7Bfill:%23c2410c%7D%40media (prefers-color-scheme:dark)%7B.t%7Bfill:%23ecebe6%7D.o%7Bstroke:%23131312%7D.r%7Bfill:%23fb923c%7D%7D</style><rect class='t' width='32' height='32' rx='8'/><circle class='o' cx='15' cy='15.5' r='7.5' fill='none' stroke-width='3.6'/><path class='r' d='M19.5 16h5.5v11l-2.75-2.2L19.5 27z'/></svg>" />
    <title>OUC Study</title>
    <script>
      // apply the saved colour theme before the first paint (lib/theme.ts keeps it in sync afterwards)
      try {
        var t = localStorage.getItem("ouc-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.mode = /^(dark|midnight|forest)$/.test(t) ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
